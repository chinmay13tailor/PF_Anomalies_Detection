<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PF Analysis</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fb;
    padding:12px;
}

/* TOP BAR */

.top-bar{
    width:100%;
    background:#fff;
    border-radius:12px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.date-input{
    height:42px;
    padding:0 14px;
    border:1px solid #dfe3eb;
    border-radius:10px;
    font-size:14px;
}

.analyze-btn{
    height:42px;
    padding:0 22px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-weight:600;
    cursor:pointer;
}

/* KPI */

.kpi-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:14px;
}

.kpi-card{
    background:#fff;
    border-radius:14px;
    padding:18px;
    position:relative;
    overflow:hidden;
    min-height:140px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.kpi-card::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:4px;
    height:100%;
}

.green::before{background:#22c55e;}
.orange::before{background:#f59e0b;}
.blue::before{background:#2563eb;}
.red::before{background:#ef4444;}

.kpi-title{
    font-size:12px;
    letter-spacing:2px;
    color:#94a3b8;
    font-weight:700;
    margin-bottom:22px;
}

.kpi-value{
    font-size:42px;
    font-weight:700;
    color:#0f172a;
    margin-bottom:14px;
}

.kpi-sub{
    color:#94a3b8;
    font-size:13px;
}

.live-badge{
    display:inline-block;
    background:#dcfce7;
    color:#16a34a;
    padding:5px 10px;
    border-radius:8px;
    font-size:11px;
    font-weight:700;
    margin-right:8px;
}

/* CHART */

.chart-card{
    background:#fff;
    border-radius:14px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.chart-title{
    font-size:16px;
    font-weight:700;
    margin-bottom:20px;
}

canvas{
    width:100% !important;
    height:420px !important;
}

/* TABLE */

.table-card{
    background:#fff;
    border-radius:14px;
    padding:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#f1f5f9;
    padding:12px;
    text-align:left;
    font-size:13px;
}

td{
    padding:12px;
    border-bottom:1px solid #e2e8f0;
    font-size:13px;
}

.low{
    color:#dc2626;
    font-weight:700;
}

.normal{
    color:#16a34a;
    font-weight:700;
}

</style>
</head>

<body>

<div class="top-bar">

    <input type="date" id="datePicker" class="date-input">

    <button class="analyze-btn" onclick="generateReport()">
        ▶ Analyze
    </button>

    <div style="margin-left:auto;color:#64748b;font-size:13px;" id="statusText">
        Ready
    </div>

</div>

<div class="kpi-grid">

    <div class="kpi-card green">
        <div class="kpi-title">AVERAGE PF</div>
        <div class="kpi-value" id="avgPF">--</div>
        <div>
            <span class="live-badge">LIVE</span>
            <span class="kpi-sub">Average from telemetry</span>
        </div>
    </div>

    <div class="kpi-card orange">
        <div class="kpi-title">MINIMUM PF</div>
        <div class="kpi-value" id="minPF">--</div>
        <div>
            <span class="live-badge">LIVE</span>
            <span class="kpi-sub">Lowest detected PF</span>
        </div>
    </div>

    <div class="kpi-card blue">
        <div class="kpi-title">LOW PF DURATION</div>
        <div class="kpi-value">
            <span id="lowPFDuration">--</span>
            <span style="font-size:28px;color:#94a3b8;">Min</span>
        </div>
        <div>
            <span class="live-badge">LIVE</span>
            <span class="kpi-sub">PF below 0.90</span>
        </div>
    </div>

    <div class="kpi-card red">
        <div class="kpi-title">ESTIMATED PENALTY</div>
        <div class="kpi-value">₹ <span id="penalty">--</span></div>
        <div>
            <span class="live-badge">LIVE</span>
            <span class="kpi-sub">Estimated</span>
        </div>
    </div>

</div>

<div class="chart-card">

    <div class="chart-title">PF Trend With Active Power</div>

    <canvas id="pfChart"></canvas>

</div>

<div class="table-card">

    <div class="chart-title">PF Event Table</div>

    <table>

        <thead>
        <tr>
            <th>Timestamp</th>
            <th>PF</th>
            <th>Active Power (kW)</th>
            <th>Status</th>
        </tr>
        </thead>

        <tbody id="eventTable"></tbody>

    </table>

</div>

<script>

/* ============================
   CONFIG
============================ */

const DEVICE_ID = "1250b550-5bdb-11f0-9b14-15d3b3a473c1";

const qs = new URLSearchParams(window.location.search);

const JWT = qs.get("token");

/* ============================
   DATE DEFAULT
============================ */

const datePicker = document.getElementById("datePicker");

const today = new Date();

datePicker.value =
    today.getFullYear() + "-" +
    String(today.getMonth()+1).padStart(2,'0') + "-" +
    String(today.getDate()).padStart(2,'0');

/* ============================
   CHART
============================ */

const ctx = document.getElementById("pfChart");

const pfChart = new Chart(ctx,{

    type:'line',

    data:{
        labels:[],
        datasets:[
            {
                label:'Power Factor',
                data:[],
                borderColor:'#2563eb',
                backgroundColor:'rgba(37,99,235,.15)',
                tension:.3,
                yAxisID:'y'
            },
            {
                label:'Active Power',
                data:[],
                borderColor:'#ef4444',
                backgroundColor:'rgba(239,68,68,.15)',
                tension:.3,
                yAxisID:'y1'
            }
        ]
    },

    options:{
        responsive:true,
        maintainAspectRatio:false,

        interaction:{
            mode:'index',
            intersect:false
        },

        scales:{
            y:{
                position:'left',
                min:0,
                max:1
            },
            y1:{
                position:'right',
                grid:{
                    drawOnChartArea:false
                }
            }
        }
    }
});

/* ============================
   FETCH TELEMETRY
============================ */

async function fetchTelemetry(startTs,endTs){

    const url =
    `https://plantwiz.pimateck.in/api/plugins/telemetry/DEVICE/${DEVICE_ID}/values/timeseries`
    + `?keys=chiller_plant_1`
    + `&startTs=${startTs}`
    + `&endTs=${endTs}`
    + `&limit=50000`
    + `&agg=NONE`;

    const response = await fetch(url,{
        method:"GET",
        headers:{
            "Content-Type":"application/json",
            "X-Authorization":"Bearer " + JWT
        }
    });

    if(!response.ok){
        throw new Error("API Error : " + response.status);
    }

    return await response.json();
}

/* ============================
   PARSE
============================ */

function parseData(apiData){

    const arr = apiData.chiller_plant_1 || [];

    return arr.map(item=>{

        let parsed = {};

        try{
            parsed = JSON.parse(item.value);
        }catch(e){}

        return{

            ts:item.ts,

            pf:parseFloat(parsed["18_Avg_PF"]) || 0,

            kw:parseFloat(parsed["18_Act_Power_Total"]) || 0,

            kwh:parseFloat(parsed["18_Act_Energy_Total"]) || 0
        };
    });
}

/* ============================
   GENERATE REPORT
============================ */

async function generateReport(){

    try{

        document.getElementById("statusText").innerHTML = "Loading...";

        const selectedDate = new Date(datePicker.value);

        const startTs = selectedDate.getTime();

        const endTs = startTs + 86400000;

        const raw = await fetchTelemetry(startTs,endTs);

        const data = parseData(raw);

        if(!data.length){

            document.getElementById("statusText").innerHTML = "No data found";

            return;
        }

        /* KPI */

        const avgPF =
            data.reduce((a,b)=>a+b.pf,0)/data.length;

        const minPF =
            Math.min(...data.map(x=>x.pf));

        const lowPFCount =
            data.filter(x=>x.pf < 0.90).length;

        const lowPFDuration =
            lowPFCount;

        const penalty =
            (lowPFDuration * 12).toFixed(0);

        document.getElementById("avgPF").innerHTML =
            avgPF.toFixed(3);

        document.getElementById("minPF").innerHTML =
            minPF.toFixed(3);

        document.getElementById("lowPFDuration").innerHTML =
            lowPFDuration;

        document.getElementById("penalty").innerHTML =
            penalty;

        /* CHART */

        pfChart.data.labels =
            data.map(x=>{

                const d = new Date(x.ts);

                return d.toLocaleTimeString();
            });

        pfChart.data.datasets[0].data =
            data.map(x=>x.pf);

        pfChart.data.datasets[1].data =
            data.map(x=>x.kw);

        pfChart.update();

        /* TABLE */

        let html = "";

        data.forEach(x=>{

            const status =
                x.pf < 0.90
                ? '<span class="low">LOW PF</span>'
                : '<span class="normal">NORMAL</span>';

            html += `
            <tr>
                <td>${new Date(x.ts).toLocaleString()}</td>
                <td>${x.pf.toFixed(3)}</td>
                <td>${x.kw.toFixed(2)}</td>
                <td>${status}</td>
            </tr>
            `;
        });

        document.getElementById("eventTable").innerHTML = html;

        document.getElementById("statusText").innerHTML =
            `${data.length} samples loaded`;

    }catch(err){

        console.error(err);

        document.getElementById("statusText").innerHTML =
            "Error loading data";
    }
}

/* ============================
   AUTO LOAD
============================ */

generateReport();

</script>

</body>
</html>
